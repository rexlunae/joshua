[workspace]
members = [".", "crates/joshua-mock-npu", "crates/joshua-llamacpp-npu", "vendor/candle-core", "vendor/candle-nn"]
# The llama.cpp adapter compiles C++ (llama.cpp itself) and is therefore not
# part of the default build: `cargo build`/`cargo test` stay pure Rust.
default-members = [".", "crates/joshua-mock-npu"]

[package]
name = "joshua"
version = "0.1.0"
edition = "2021"
description = "An mmap-based LLM inference engine for the Rust ecosystem — a Rust clone of Cactus"
license = "MIT"
repository = "https://github.com/rexlunae/joshua"
homepage = "https://github.com/rexlunae/joshua"
documentation = "https://docs.rs/joshua"
readme = "README.md"
rust-version = "1.89"
keywords = ["llm", "inference", "ai", "openai", "gguf"]
categories = ["science", "api-bindings"]

# docs.rs builds with `--all-features` by default, which would try to compile
# the CUDA backend (needs the NVIDIA toolkit) and fail the docs build.  Build
# docs for the default pure-Rust feature set instead.
[package.metadata.docs.rs]
all-features = false

[[bin]]
name = "joshua"
path = "src/main.rs"

[[example]]
name = "cluster_linear"
required-features = ["distributed"]

[lib]
name = "joshua"
path = "src/lib.rs"

[features]
sycl = ["candle-core/sycl", "candle-nn/sycl"]
default = []
# GPU acceleration. CPU inference stays pure Rust; enabling one of these
# pulls in the corresponding candle backend (CUDA needs the NVIDIA toolkit
# at build time, Metal is macOS-only).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
]
# OpenCL accelerator (vendored candle-core `opencl` backend: OpenClDevice /
# OpenClStorage + buffer round-trip). Bring-up target is Intel OpenCL hardware
# (iGPU now; a more powerful Intel card later). Requires a system libOpenCL
# (-lOpenCL, e.g. intel-opencl-icd on Linux) at link time.
opencl = ["candle-core/opencl", "candle-nn/opencl"]
# Vulkan accelerator (vendored candle-core `vulkan` backend: VulkanDevice /
# VulkanStorage + host-visible round-trip + naga-compiled compute kernels).
# Bring-up target is the AMD Renoir iGPU (unified memory, RADV). Requires a
# system Vulkan loader + ICD (libvulkan.so, e.g. mesa-vulkan-drivers) at
# runtime; ash loads it dynamically so there is no hard link dependency.
vulkan = ["candle-core/vulkan", "candle-nn/vulkan"]
# HTTPS termination via rustls. Opt-in because the ring crypto provider
# compiles C/assembly, which would break the default build's
# "only a Rust toolchain required" guarantee.
tls = ["dep:axum-server", "dep:rustls"]
# Experimental static-cluster discovery and authenticated UDP/TCP collectives.
distributed = ["dep:mdns-sd", "dep:socket2", "dep:hmac"]

# Zero-copy Metal weights (mmap-backed GPU buffers) use the vendored
# candle-metal-kernels, patched with offset-aware quantized entry points.
# Always applied so the vendored crate is the one candle-core links against.
[patch.crates-io]
# candle-core is patched to the rexlunae/candle-core fork (a candle-core 0.11.0
# with the Vulkan accelerator backend: VulkanDevice/VulkanStorage + CustomOp1/2
# ::vulkan_fwd hooks). Using a git fork means joshua's work doesn't wait on
# upstream; the vendored copy in vendor/candle-core is the same content.
# Built from the vendored copy so the tree is self-contained: the OpenCL
# backend's native kernels, block-quantized device storage and zero-copy
# mapping live in vendor/candle-core (the fork's `joshua-vulkan` branch is
# the same content minus those additions).
candle-core = { path = "vendor/candle-core" }
# candle-nn patched to the rexlunae/candle-nn fork (device-native CustomOp
# `vulkan_fwd` for softmax/RMSNorm), so it doesn't wait on upstream either.
candle-nn = { path = "vendor/candle-nn" }
# candle-kernels is patched to a tiny fork (rexlunae/candle-kernels) carrying
# two CUDA-12.4 compatibility fixes, instead of vendoring the crate's ~21K
# lines of C kernels into this tree: (1) compatibility.cuh redefines
# __hmax_nan/__hmin_nan for __half, which the 12.4 toolkit already declares on
# every architecture, and (2) build.rs omits the WMMA (tensor-core) MoE kernels
# on compute capability < 7.0 where load_matrix_sync does not exist. Both are
# needed to build against CUDA 12.4 for Maxwell (sm_52).
candle-kernels = { git = "https://github.com/rexlunae/candle-kernels.git", rev = "a9427cc" }
candle-metal-kernels = { path = "vendor/candle-metal-kernels" }
# Vendored so joshua can fix upstream gaps — currently: quantized_llama must
# honour the GGUF head_dim (`llama.attention.key_length` / rope dimension)
# instead of assuming n_embd/n_head (MiniCPM5-1B: 1536 hidden, 16 heads,
# head_dim 128), and MAX_SEQ_LEN is raised to 131072 for 128K-context models.
candle-transformers = { path = "vendor/candle-transformers" }

[dependencies]
# Pure Rust ML inference (no C/C++ dependencies required for CPU)
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"

# Metal quantized kernels (the vendored copy, patched with offset-aware
# entry points for zero-copy weights) and the objc2 binding needed to create
# a no-copy buffer over the model mapping.  Both only under the `metal`
# feature.
candle-metal-kernels = { version = "0.11", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

# f16/bf16 block element types, for reinterpreting memory-mapped GGUF tensors
# in place.  Kept in lockstep with the version candle already resolves to.
half = "2"

# Tokenization (pure Rust BPE/WordPiece — loads tokenizer.json from HuggingFace)
# fancy-regex is the pure Rust regex backend (replaces the default Oniguruma C backend).
# esaxx_fast is omitted to avoid the C++ suffix-array helper.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Memory-mapped model loading (pure Rust wrapper over mmap(2))
memmap2 = "0.9"

# mlock(2) for pinning the hot weight set in RAM (unix)
libc = "0.2"

# Runtime loading of NPU vendor plugins (thin safe wrapper over dlopen)
libloading = "0.8"

# Row-parallel quantized matmul kernels (already in the dependency tree via
# candle-transformers; made a direct dependency for the SIMD/threading work).
rayon = "1"

# WAV decoding for Whisper speech-to-text (pure Rust)
hound = "3.5"

# Media payload encoding on the NPU shim control pipe (pure Rust)
base64 = "0.22"

# Chat-template rendering (pure Rust Jinja2 engine).
# pycompat adds Python string/dict methods (.strip(), .title(), …) that
# HuggingFace chat templates rely on.
minijinja = { version = "2", features = ["json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Sampling
rand = "0.8"

# API-key comparison (pure Rust SHA-256): keys are hashed before comparing
# so the check is fixed-length and leaks nothing through timing.
sha2 = "0.10"

# HTTP server & utilities
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-stream = "0.1"

# HTTPS support (the optional `tls` feature). axum-server is built without
# a crypto provider so we can pick ring (needs only a C compiler) over the
# default aws-lc-rs (needs CMake).
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
mdns-sd = { version = "0.21.4", optional = true }
socket2 = { version = "0.6.5", optional = true }
hmac = { version = "0.12.1", optional = true }

[dev-dependencies]
# Used by integration tests to synthesise tiny GGUF model files and
# whisper checkpoints, and to generate WAV fixtures.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hound = "3.5"
# Used by the server tests to drive the router in-process and decode the
# embedded self-signed test certificate (all pure Rust).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
