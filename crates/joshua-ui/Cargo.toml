[package]
name = "joshua-ui"
version = "0.1.0"
edition = "2021"
description = "Web frontend (Dioxus + Bulma) to monitor and drive a Joshua instance or cluster"
license = "MIT"
repository = "https://github.com/rexlunae/joshua"
rust-version = "1.89"
publish = false

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-bulma = { version = "0.7.3", features = ["web"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# No TLS backend on the host: the browser does TLS for the wasm build, and the
# host build only exists for `cargo check` and the unit tests.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
