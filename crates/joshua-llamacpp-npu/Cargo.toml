[package]
name = "joshua-llamacpp-npu"
version = "0.1.0"
edition = "2021"
description = "llama.cpp compatibility plugin for Joshua's joshua_npu_* ABI — brings every ggml backend (Hexagon NPU, CANN, CUDA, Vulkan, OpenCL, …) to Joshua"
license = "MIT"
repository = "https://github.com/rexlunae/joshua"
homepage = "https://github.com/rexlunae/joshua"
documentation = "https://docs.rs/joshua-llamacpp-npu"
readme = "README.md"
rust-version = "1.88"
keywords = ["llama-cpp", "npu", "llm", "ggml", "joshua"]
categories = ["api-bindings"]

# docs.rs builds with `--all-features` by default, which would try to compile
# the CUDA/Vulkan/Metal llama.cpp backends and fail the docs build.  Build
# docs for the default feature set instead (llama.cpp CPU is still compiled —
# docs.rs has cmake + a C++ toolchain).
[package.metadata.docs.rs]
all-features = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Bindings that vendor and build llama.cpp (requires a C++ toolchain + CMake;
# this crate is deliberately excluded from the workspace default build so the
# pure-Rust core never compiles C++).
llama-cpp-2 = { version = "0.1.151", features = ["mtmd"] }

[features]
default = []
# Forwarded llama.cpp GPU backends. NPU backends (Hexagon, CANN) are enabled
# by building llama.cpp with the vendor SDK — see the crate docs.
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
# Build llama.cpp with GGML_BACKEND_DL so ggml backends ship as separate
# `libggml-<name>` modules, and auto-load them at startup. This is the path
# for NPU backends (Hexagon, CANN): build the backend module for the target
# device, then let it be discovered at runtime (see load_dynamic_backends).
dynamic-backends = ["llama-cpp-2/dynamic-backends"]
