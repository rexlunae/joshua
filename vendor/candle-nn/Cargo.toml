[package]
edition = "2021"
name = "candle-nn"
version = "0.11.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Minimalist ML framework."
readme = "README.md"
keywords = [
    "blas",
    "tensor",
    "machine-learning",
]
categories = ["science"]
